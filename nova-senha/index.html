<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha — Weblar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy:#0D1520; --navy-card:#141F30; --gold:#D4A017; --texto:#F1F5F9; --texto-fraco:#9AA5B1; --linha:#2A3646; }
  * { box-sizing: border-box; }
  body { font-family:'Inter',sans-serif; background:var(--navy); color:var(--texto); margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card { background:var(--navy-card); border:1px solid rgba(212,160,23,0.2); border-radius:16px; padding:44px 40px; max-width:440px; width:100%; }
  .logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:28px; text-decoration:none; }
  .logo img { width:30px; height:30px; }
  .logo span { font-family:'Playfair Display',serif; font-weight:700; font-size:1.3rem; color:var(--texto); }
  h1 { font-family:'Playfair Display',serif; font-size:1.5rem; margin:0 0 8px; text-align:center; }
  .sub { color:var(--texto-fraco); font-size:0.92rem; text-align:center; margin:0 0 28px; }
  label { display:block; font-size:0.85rem; color:var(--texto-fraco); margin-bottom:6px; }
  input { width:100%; padding:12px; background:var(--navy); border:1px solid var(--linha); border-radius:8px; color:var(--texto); font-family:inherit; font-size:0.95rem; margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--gold); }
  button { width:100%; background:var(--gold); color:var(--navy); border:none; padding:13px; border-radius:8px; font-family:inherit; font-weight:600; font-size:0.95rem; cursor:pointer; }
  button:disabled { opacity:0.5; }
  .msg { font-size:0.88rem; margin-top:14px; text-align:center; }
  .msg.ok { color:#6fbf8b; } .msg.erro { color:#e05656; }
</style>
</head>
<body>
<div class="card">
  <a href="../" class="logo"><img src="../assets/logo-simbolo.svg" alt=""><span>Weblar</span></a>
  <h1>Criar nova senha</h1>
  <p class="sub">Digite sua nova senha abaixo.</p>
  <div id="area-form">
    <label for="senha">Nova senha</label>
    <input type="password" id="senha" placeholder="Mínimo 6 caracteres">
    <label for="senha2">Confirmar nova senha</label>
    <input type="password" id="senha2" placeholder="Repita a senha">
    <button id="btn-salvar">Salvar nova senha</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const sb = window.supabase.createClient(
  'https://unsvccbzrrgnvzvdwwrz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuc3ZjY2J6cnJnbnZ6dmR3d3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MzE0OTUsImV4cCI6MjEwMDAwNzQ5NX0.LI121gkIHkiplDTcolv6e6is6LxN0I1Ebmil5tJKRxY'
);
const msg = document.getElementById('msg');

// A página só funciona se vier do link de recuperação (Supabase cria sessão temporária)
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || session) {
    // ok, pode trocar
  }
});

document.getElementById('btn-salvar').addEventListener('click', async () => {
  const s1 = document.getElementById('senha').value;
  const s2 = document.getElementById('senha2').value;
  msg.textContent = ''; msg.className = 'msg';
  if (s1.length < 6) { msg.textContent = 'A senha precisa de pelo menos 6 caracteres.'; msg.className = 'msg erro'; return; }
  if (s1 !== s2) { msg.textContent = 'As senhas não coincidem.'; msg.className = 'msg erro'; return; }
  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const { error } = await sb.auth.updateUser({ password: s1 });
  if (error) {
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
    msg.textContent = 'Erro: ' + error.message + ' (o link pode ter expirado — peça um novo)'; msg.className = 'msg erro';
  } else {
    document.getElementById('area-form').innerHTML = '<p class="sub" style="color:#6fbf8b;">Senha alterada com sucesso!</p><a href="../painel/" style="display:block;text-align:center;background:#D4A017;color:#0D1520;padding:13px;border-radius:8px;text-decoration:none;font-weight:600;">Ir para o painel</a>';
  }
});
</script>
</body>
</html>
