<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Weblar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0D1520;
    --navy-card: #141F30;
    --gold: #D4A017;
    --texto: #F1F5F9;
    --texto-fraco: #9AA5B1;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--navy);
    color: var(--texto);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: var(--navy-card);
    border: 1px solid rgba(212, 160, 23, 0.2);
    border-radius: 14px;
    padding: 40px;
    max-width: 380px;
    width: 100%;
  }
  .logo-topo {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
    text-decoration: none;
  }
  .logo-topo img { width: 32px; height: 32px; }
  .logo-topo span {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--texto);
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 700;
    text-align: center;
    margin: 0 0 28px;
    color: var(--texto);
  }
  label {
    display: block;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--texto-fraco);
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    margin-top: 6px;
    background: var(--navy);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--texto);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    margin-top: 26px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: var(--navy);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: 0.85rem; text-align: center; }
  .erro { color: #e07856; }
  .sucesso { color: #6fbf8b; }
  .cadastro-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--texto-fraco); }
  .cadastro-link a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <a href="../" class="logo-topo">
    <img src="../assets/logo-simbolo.svg" alt="">
    <span>Weblar</span>
  </a>

  <h1>Entrar na sua conta</h1>

  <form id="form-login">
    <label for="email">E-mail</label>
    <input type="text" id="email" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" required>

    <button type="submit" id="btn-entrar">Entrar</button>
    <div id="msg"></div>
  </form>

  <div class="cadastro-link">Ainda não tem conta? <a href="../cadastro/">Criar conta</a></div>
</div>

<script>
const sbLogin = window.supabase.createClient(
  'https://unsvccbzrrgnvzvdwwrz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuc3ZjY2J6cnJnbnZ6dmR3d3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MzE0OTUsImV4cCI6MjEwMDAwNzQ5NX0.LI121gkIHkiplDTcolv6e6is6LxN0I1Ebmil5tJKRxY'
);

// Se já estiver logado, manda direto pro painel
sbLogin.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = '../painel/';
});

const form = document.getElementById('form-login');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn-entrar');

// Volta pra página de onde veio (ex: pedir-orcamento), se houver ?redirect=
const params = new URLSearchParams(window.location.search);
const redirect = params.get('redirect') || '../painel/';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  msg.className = '';

  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const { error } = await sbLogin.auth.signInWithPassword({
    email: email,
    password: senha
  });

  btn.disabled = false;
  btn.textContent = 'Entrar';

  if (error) {
    msg.textContent = 'E-mail ou senha incorretos.';
    msg.className = 'erro';
    return;
  }

  window.location.href = redirect;
});
</script>

</body>
</html>
