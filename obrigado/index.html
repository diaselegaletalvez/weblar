  <style>
    /* ===== Página de obrigado ===== */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #obrigado {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background-color: var(--cor-fundo);
    }

    .obrigado-card {
      width: 100%;
      max-width: 560px;
      text-align: center;
      background-color: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio);
      padding: 3rem 2.25rem;
      box-shadow: var(--sombra-card);
    }

    .obrigado-logo {
      display: inline-block;
      margin-bottom: 2rem;
    }

    .obrigado-icone {
      font-size: clamp(3.5rem, 10vw, 4.5rem);
      line-height: 1;
      margin-bottom: 1.25rem;
    }

    #obrigado h1 {
      font-size: clamp(1.7rem, 4.5vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .obrigado-texto {
      color: var(--cor-suave);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .obrigado-voltar {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--cor-suave);
      font-size: 0.95rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .obrigado-voltar:hover {
      color: var(--cor-marca);
    }

    @media (max-width: 600px) {
      .obrigado-card {
        padding: 2.25rem 1.5rem;
      }

      .obrigado-card .btn-principal {
        display: block;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <section id="obrigado">
    <div class="obrigado-card">
      <a href="/" class="logo obrigado-logo">Weblar</a>

      <div class="obrigado-icone" aria-hidden="true">✅</div>

      <h1>Pedido recebido! 🎉</h1>

      <p class="obrigado-texto">Obrigado pelo seu interesse na Weblar. Recebi seu pedido e respondo em até 24 horas. Enquanto isso, você já pode preencher o briefing do seu site para adiantar.</p>

      <a href="/briefing/" class="btn-principal">Preencher briefing</a>

      <div>
        <a href="/" class="obrigado-voltar">← Voltar ao início</a>
      </div>
    </div>
  </section>

</body>
