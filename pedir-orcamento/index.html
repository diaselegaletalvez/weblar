<body>
  <header id="topo">
    <div class="container topo-conteudo">
      <a href="../" class="logo">
        <img src="../assets/logo-simbolo.svg" alt="" class="logo-simbolo">
        <span class="logo-nome">Weblar</span>

      </nav>

  <section id="orcamento">
    <div class="container">
      <div class="orcamento-cabecalho">
        <h2>Peça seu orçamento</h2>
        <p class="orcamento-subtitulo">Conte um pouco sobre o seu negócio. Respondo em até 24h, sem compromisso.</p>
      </div>

      <form class="form-orcamento" action="https://formspree.io/f/mqevazaj" method="POST">
        <input type="hidden" name="_next" value="https://weblar.app.br/obrigado/">
        <div class="campo-grupo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" class="campo" placeholder="Seu nome" required>
        </div>

        <div class="campo-grupo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" class="campo" placeholder="voce@email.com" required>
        </div>

        <div class="campo-grupo">
          <label for="whatsapp">WhatsApp</label>
          <input type="tel" id="whatsapp" name="whatsapp" class="campo" placeholder="(00) 00000-0000">
        </div>

        <div class="campo-grupo">
          <label for="negocio">Tipo de negócio</label>
          <input type="text" id="negocio" name="negocio" class="campo" placeholder="Ex.: padaria, clínica, oficina...">
        </div>

        <div class="campo-grupo">
          <label for="plano">Plano de interesse</label>
          <select id="plano" name="plano" class="campo">
            <option value="">Ainda não sei / quero ajuda para escolher</option>
            <option value="Básico">Básico — R$ 400</option>
            <option value="Profissional">Profissional — R$ 700</option>
            <option value="Completo">Completo — R$ 1.200</option>
          </select>
        </div>


        <div class="campo-grupo">
          <label for="investimento">Quanto pretende investir?</label>
          <select id="investimento" name="investimento" class="campo">
            <option value="">Prefiro não dizer / não sei ainda</option>
            <option value="Até R$ 500">Até R$ 500</option>
            <option value="R$ 500 a R$ 1.000">R$ 500 a R$ 1.000</option>
            <option value="R$ 1.000 a R$ 2.000">R$ 1.000 a R$ 2.000</option>
            <option value="Acima de R$ 2.000">Acima de R$ 2.000</option>
          </select>
        </div>

        <div class="campo-grupo">
          <label for="link-atual">Já tem site ou Instagram? Cola o link</label>
          <input type="text" id="link-atual" name="link_atual" class="campo" placeholder="instagram.com/seunegocio ou seusite.com.br">
        </div>

        <div class="campo-grupo">
          <label for="referencia">Algum site que você gosta do estilo?</label>
          <input type="text" id="referencia" name="referencia" class="campo" placeholder="Cola o link de um site que te inspira (opcional)">
        </div>

        <div class="campo-grupo">
          <label for="prazo">Prazo desejado</label>
          <select id="prazo" name="prazo" class="campo">
            <option value="">Sem pressa</option>
            <option value="Urgente (até 1 semana)">Urgente (até 1 semana)</option>
            <option value="Até 2 semanas">Até 2 semanas</option>
            <option value="Até 1 mês">Até 1 mês</option>
          </select>
        </div>
        <div class="campo-grupo">
          <label for="mensagem">O que o site precisa ter?</label>
          <textarea id="mensagem" name="mensagem" class="campo" placeholder="Ex.: cardápio, galeria de fotos, mapa, botão de WhatsApp..."></textarea>
        </div>

        <button type="submit" class="btn-principal form-enviar">Enviar pedido de orçamento</button>
      </form>
    </div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async () => {
  const cliOrc = window.supabase.createClient(
    'https://unsvccbzrrgnvzvdwwrz.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuc3ZjY2J6cnJnbnZ6dmR3d3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MzE0OTUsImV4cCI6MjEwMDAwNzQ5NX0.LI121gkIHkiplDTcolv6e6is6LxN0I1Ebmil5tJKRxY'
  );

  // 1) Exige login: sem sessão, manda pro login e volta pra cá depois
  const { data: { session } } = await cliOrc.auth.getSession();
  if (!session) {
    window.location.href = '../login/?redirect=pedir-orcamento.html';
    return;
  }
  const user = session.user;

  // 2) Pré-preenche o e-mail com o da conta e trava o campo
  const campoEmail = document.getElementById('email');
  if (campoEmail) {
    campoEmail.value = user.email;
    campoEmail.readOnly = true;
    campoEmail.style.opacity = '0.7';
  }
  // Pré-preenche o nome se tiver no perfil
  const { data: perfil } = await cliOrc.from('profiles').select('full_name').eq('id', user.id).single();
  const campoNome = document.getElementById('nome');
  if (campoNome && perfil && perfil.full_name) campoNome.value = perfil.full_name;

  // 3) Ao enviar: grava o pedido no Supabase (aparece no painel) ANTES do Formspree
  const form = document.querySelector('.form-orcamento');
  if (form) {
    form.addEventListener('submit', async (e) => {
      // grava no banco; se falhar, deixa o Formspree seguir mesmo assim
      try {
        const negocio = document.getElementById('negocio')?.value.trim();
        const plano = document.getElementById('plano')?.value;
        const titulo = negocio ? ('Site para ' + negocio) : 'Novo pedido de orçamento';
        await cliOrc.from('orders').insert({
          user_id: user.id,
          title: titulo,
          status: 'recebido'
        });
      } catch (err) {
        console.error('Falha ao gravar pedido no painel:', err);
      }
      // não damos preventDefault: o Formspree continua enviando pro seu Gmail normalmente
    });
  }
})();
</script>
